    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ matrix.target.jdk }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "${{ matrix.target.gradle }}"

      - name: Build legacy
        if: matrix.target.family == 'legacy'
        run: |
          gradle -p legacy clean build \
            -Pminecraft_version="${{ matrix.target.mc }}" \
            -Pjava_version="${{ matrix.target.target_java }}" \
            -Ploader_version="${{ matrix.target.loader }}"

      - name: Build modern 26.x
        if: matrix.target.family == 'modern'
        run: |
          gradle -p modern clean build \
            -Pminecraft_version="${{ matrix.target.mc }}" \
            -Ploader_version="${{ matrix.target.loader }}" \
            -Ploom_version="${{ matrix.target.loom }}"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: no-pause-mc${{ matrix.target.mc }}
          path: ${{ matrix.target.family }}/build/libs/no-pause-mc${{ matrix.target.mc }}-1.0.0.jar
          if-no-files-found: error
