plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

def mc = providers.gradleProperty('minecraft_version').get()
def targetJava = Integer.parseInt(providers.gradleProperty('java_version').get())
def loader = providers.gradleProperty('loader_version').getOrElse('0.18.1')
def modVersion = providers.gradleProperty('mod_version').getOrElse('1.0.0')

group = 'dev.layne'
version = modVersion

base {
    archivesName = "no-pause-mc${mc}"
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader}"
}

processResources {
    inputs.property 'version', modVersion
    inputs.property 'minecraft_version', mc

    filesMatching('fabric.mod.json') {
        expand(
            version: modVersion,
            minecraft_version: mc
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJava
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.toVersion(targetJava)
    targetCompatibility = JavaVersion.toVersion(targetJava)
}
