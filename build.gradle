plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

def minecraftVersion = providers.gradleProperty('minecraft_version').getOrElse('1.21.11')
def targetJava = Integer.parseInt(providers.gradleProperty('java_version').getOrElse('21'))
def modVersion = providers.gradleProperty('mod_version').getOrElse('1.0.0')
def loaderVersion = providers.gradleProperty('loader_version').getOrElse('0.19.4')

version = modVersion
group = 'dev.layne'

base {
    archivesName = "no-pause-mc${minecraftVersion}"
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
}

processResources {
    inputs.property 'version', modVersion
    inputs.property 'minecraft_version', minecraftVersion

    filesMatching('fabric.mod.json') {
        expand(
            version: modVersion,
            minecraft_version: minecraftVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJava
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.toVersion(targetJava)
    targetCompatibility = JavaVersion.toVersion(targetJava)
}
